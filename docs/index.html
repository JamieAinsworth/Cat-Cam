<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0f0f0f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <title>Cat Cam</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    button { -webkit-tap-highlight-color: transparent; }

    :root {
      --bg: #0f0f0f;
      --surface: #1c1c1e;
      --border: #38383a;
      --accent: #f05dda;
      --danger: #dc2626;
      --text: #f5f5f7;
      --muted: #8e8e93;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    @keyframes btn-pop { 0%{transform:scale(1)} 40%{transform:scale(1.18)} 100%{transform:scale(1)} }

    /* ── Animations ── */
    @keyframes fadeIn  { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }

    .screen-fade { animation: fadeIn 0.25s ease both; }
    .slide-up    { animation: slideUp 0.28s cubic-bezier(0.22,1,0.36,1) both; }

    /* ripple host */
    .btn-primary, .btn-text { position: relative; overflow: hidden; }
    .ripple {
      position: absolute;
      border-radius: 50%;
      transform: scale(0);
      background: rgba(255,255,255,0.25);
      animation: ripple-anim 0.5s linear;
      pointer-events: none;
    }
    @keyframes ripple-anim { to { transform: scale(4); opacity: 0; } }

    @keyframes slideOutLeft {
      from { opacity: 1; transform: translateX(0); }
      to   { opacity: 0; transform: translateX(-60px); }
    }
    .slide-out { animation: slideOutLeft 0.32s cubic-bezier(0.4,0,1,1) both; }

    /* ── Setup screen ── */
    #setup {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 32px 24px;
      height: 100%;
      justify-content: center;
      max-width: 420px;
      margin: 0 auto;
      width: 100%;
    }

    .setup-title { font-size: 1.75rem; font-weight: 700; text-align: center; margin-bottom: 4px; }
    .setup-sub   { font-size: 0.9rem; color: var(--muted); text-align: center; margin-bottom: 8px; }

    #cat-photo {
      width: 180px;
      height: 180px;
      border-radius: 20px;
      object-fit: cover;
      object-position: center center;
      display: block;
      margin: 0 auto 16px;
      border: 3px solid var(--border);
    }

    .field-group { display: flex; flex-direction: column; gap: 6px; }
    .field-label { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }

    input {
      padding: 13px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 1rem;
      width: 100%;
      outline: none;
      text-align: center;
    }
    input:focus { border-color: var(--accent); }

    .btn-primary {
      padding: 14px;
      border-radius: 50px;
      border: none;
      background: rgba(255,255,255,0.12);
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 4px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: background 0.2s;
    }
    .btn-primary:active { background: rgba(255,255,255,0.18); }

    .btn-text {
      background: none; border: none; color: var(--muted);
      font-size: 0.9rem; cursor: pointer; padding: 8px; text-align: center;
    }
    .btn-text:active { color: var(--text); }

    #setup-error {
      display: none;
      color: var(--danger);
      font-size: 0.85rem;
      text-align: center;
      padding: 2px 0;
    }

    /* ── Loading screen ── */
    #loading {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      height: 100%;
      position: relative;
    }
    .spinner {
      width: 72px; height: 72px;
      border: 5px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading-status { font-size: 0.95rem; color: var(--muted); }
    #cancel-connect-btn {
      position: absolute;
      bottom: max(28px, env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
    }

    /* ── Camera screen ── */
    #cam { display: none; flex-direction: column; height: 100%; }

    #video-wrap {
      flex: 1;
      position: relative;
      overflow: hidden;
      background: #000;
      touch-action: none;
    }

    #video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      transform-origin: center center;
      will-change: transform;
    }

    #status-badge {
      position: absolute;
      top: 12px;
      left: 12px;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      cursor: pointer;
      user-select: none;
      transition: background 0.2s;
    }
    .s-live       { background: #16a34a !important; color: #fff; }
    .s-connecting { color: #facc15; }
    .s-error      { background: rgba(220,38,38,0.7) !important; color: #fff; }

    #stats-overlay {
      display: none;
      position: absolute;
      top: 44px;
      left: 12px;
      background: rgba(0,0,0,0.72);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 0.75rem;
      line-height: 1.8;
      color: var(--text);
      min-width: 180px;
      z-index: 90;
      animation: fadeIn 0.15s ease both;
    }
    #stats-overlay.open { display: block; }
    #stats-overlay dt { color: var(--muted); float: left; margin-right: 6px; }
    #stats-overlay dd { margin: 0; font-weight: 600; text-align: right; }

    #conn-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border: none;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 1.2rem;
      cursor: pointer;
      transition: background 0.15s;
    }
    #conn-btn:hover, #conn-btn:active { background: rgba(255, 255, 255, 0.22); }

    /* ── Controls bar ── */
    #controls {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 20px;
      z-index: 100;
    }

    @keyframes btn-pop {
      0%   { transform: scale(1); }
      50%  { transform: scale(1.18); }
      100% { transform: scale(1); }
    }

    .icon-btn {
      width: 54px;
      height: 54px;
      flex-shrink: 0;
      border-radius: 50%;
      border: none;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: var(--muted);
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, transform 0.1s;
      padding: 0;
    }
    .icon-btn img, #ptt-btn img {
      width: 26px;
      height: 26px;
      display: block;
      pointer-events: none;
      filter: brightness(0) invert(1);
    }
    .icon-btn:active { background: rgba(255, 255, 255, 0.28); transform: scale(0.9); }
    .icon-btn.pop    { animation: btn-pop 0.3s cubic-bezier(0.22,1,0.36,1) both; }

    #ptt-btn {
      width: 54px;
      height: 54px;
      flex-shrink: 0;
      border-radius: 50%;
      border: none;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: var(--muted);
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      -webkit-user-select: none;
      transition: background 0.15s, transform 0.15s;
      padding: 0;
    }
    #ptt-btn img {
      width: 26px;
      height: 26px;
      display: block;
      pointer-events: none;
      filter: brightness(0) invert(1);
    }
    #ptt-btn:active { background: rgba(255, 255, 255, 0.28); transform: scale(0.9); }
    #ptt-btn.pop    { animation: btn-pop 0.3s cubic-bezier(0.22,1,0.36,1) both; }
    #ptt-btn.talking     { background: rgba(34, 197, 94, 0.25); color: #22c55e; }
    .icon-btn.sound-active { background: rgba(34, 197, 94, 0.25); }
    #ptt-btn:disabled  { opacity: 0.35; }

    #reconnect-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease;
      z-index: 40;
    }
    #reconnect-overlay.visible {
      opacity: 1;
      pointer-events: auto;
    }
    #reconnect-status { font-size: 0.95rem; color: var(--muted); }

    /* ── Disconnect confirm popup ── */
    #disconnect-overlay {
      position: fixed; inset: 0; z-index: 200;
      display: none; align-items: center; justify-content: center;
      padding: 24px;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }
    #disconnect-overlay.open { display: flex; }
    #disconnect-sheet {
      width: 100%; max-width: 320px;
      background: rgba(255,255,255,0.12);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 20px;
      padding: 24px;
      text-align: center;
      animation: popIn 0.25s cubic-bezier(0.22,1,0.36,1) both;
    }
    #disconnect-sheet h2 { font-size: 1.05rem; font-weight: 700; margin-bottom: 8px; }
    #disconnect-sheet p  { font-size: 0.85rem; color: var(--muted); margin-bottom: 20px; }
    .disconnect-btns { display: flex; gap: 12px; }
    .disconnect-btns button { flex: 1; padding: 12px; border-radius: 50px; border: none;
      font-size: 0.95rem; font-weight: 600; cursor: pointer; }
    #disconnect-confirm { background: rgba(220,38,38,0.8); color: #fff; }
    #disconnect-cancel  { background: rgba(255,255,255,0.12); color: #fff; }

    /* ── Camera settings panel ── */
    #cam-settings {
      position: fixed; inset: 0; z-index: 50;
      display: none; align-items: center; justify-content: center;
      padding: 24px;
    }
    #cam-settings.open { display: flex; }
    #cam-backdrop {
      position: absolute; inset: 0;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }
    #cam-sheet {
      position: relative;
      width: 100%;
      max-width: 420px;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 20px;
      padding: 20px;
      max-height: 80vh;
      overflow-y: auto;
      animation: popIn 0.25s cubic-bezier(0.22,1,0.36,1) both;
    }
    @keyframes popIn {
      from { opacity: 0; transform: scale(0.88); }
      to   { opacity: 1; transform: scale(1); }
    }
    .sheet-header {
      display: flex; justify-content: space-between;
      align-items: center; margin-bottom: 20px;
    }
    .sheet-header h2 { font-size: 1.05rem; font-weight: 700; }
    .close-btn { background: none; border: none; color: var(--muted); font-size: 1.2rem; cursor: pointer; }
    .ctrl-group { margin-bottom: 18px; }
    .ctrl-group-label {
      font-size: 0.7rem; text-transform: uppercase;
      letter-spacing: 0.08em; color: var(--muted); margin-bottom: 10px;
    }
    .ctrl-row {
      display: flex; align-items: center;
      gap: 10px; margin-bottom: 10px;
    }
    .ctrl-row.disabled { opacity: 0.35; pointer-events: none; }
    .ctrl-label { font-size: 0.82rem; flex: 0 0 130px; }
    .ctrl-slider { flex: 1; accent-color: var(--accent); }
    .ctrl-value { font-size: 0.78rem; color: var(--muted); min-width: 38px; text-align: right; }
    .reset-btn {
      background: none; border: none; color: var(--muted);
      font-size: 1rem; cursor: pointer; padding: 0 2px; flex-shrink: 0;
    }
    .reset-btn:active { color: var(--text); }
    .ctrl-toggle { position: relative; width: 44px; height: 24px; flex-shrink: 0; }
    .ctrl-toggle input { opacity: 0; width: 0; height: 0; }
    .toggle-track {
      position: absolute; inset: 0;
      background: var(--border); border-radius: 24px; cursor: pointer;
      transition: background 0.2s;
    }
    .ctrl-toggle input:checked + .toggle-track { background: var(--accent); }
    .toggle-track::after {
      content: ''; position: absolute;
      width: 18px; height: 18px; background: #fff;
      border-radius: 50%; top: 3px; left: 3px;
      transition: transform 0.2s;
    }
    .ctrl-toggle input:checked + .toggle-track::after { transform: translateX(20px); }
  </style>
</head>
<body>

<!-- ── Setup ──────────────────────────────────────────────────────────────── -->
<div id="setup">
  <img id="cat-photo" src="images/IMG20260730084312~2.jpg" alt="Cat">
  <p class="setup-title">Vivienne Checker</p>

  <!-- Shown when credentials already saved -->
  <div id="quick-connect" style="display:none;flex-direction:column;gap:12px;align-items:center">
    <p id="quick-host" class="setup-sub" style="display:none"></p>
    <p id="setup-error"></p>
    <button class="btn-primary" id="quick-connect-btn" style="width:100%">Connect</button>
    <button class="btn-text" id="edit-creds-btn">Edit credentials</button>
  </div>

  <!-- Full credentials form -->
  <div id="full-form" style="display:flex;flex-direction:column;gap:12px">
    <div class="field-group">
      <span class="field-label">Username</span>
      <input id="cfg-user" type="text" autocomplete="username">
    </div>
    <div class="field-group">
      <span class="field-label">Password</span>
      <input id="cfg-pass" type="password" autocomplete="current-password">
    </div>
    <button class="btn-primary" id="connect-btn">Connect</button>
    <button class="btn-text" id="cancel-edit-btn" style="display:none">Cancel</button>
  </div>
</div>

<!-- Loading -->
<div id="loading">
  <div class="spinner"></div>
  <p id="loading-status">Connecting…</p>
  <button class="btn-text" id="cancel-connect-btn">Cancel</button>
</div>

<!-- ── Camera ─────────────────────────────────────────────────────────────── -->
<div id="cam">
  <div id="video-wrap">
    <video id="video" autoplay playsinline muted></video>
    <div id="status-badge" class="s-connecting">Connecting…</div>
    <dl id="stats-overlay"></dl>
    <button id="conn-btn" title="Disconnect">✕</button>
    <!-- Full-screen reconnect overlay -->
    <div id="reconnect-overlay">
      <div class="spinner"></div>
      <p id="reconnect-status">Reconnecting…</p>
    </div>
  </div>
  <div id="controls">
    <!-- Mute button: no-sound icon by apien - https://www.flaticon.com/free-icons/no-sound -->
    <button class="icon-btn muted" id="mute-btn"><img src="icons/no-sound.png" alt="Mute audio"></button>
    <!-- Push-to-talk button: mic-inactive/active icons by Kiranshastry & Maxim Basinski - https://www.flaticon.com/free-icons/mic -->
    <button class="icon-btn" id="ptt-btn"><img src="icons/mic-inactive.png" alt="Microphone"></button>
    <!-- Camera settings button: camera icon by Magnific - https://www.flaticon.com/free-icons/photography -->
    <button class="icon-btn" id="cam-settings-btn"><img src="icons/camera.png" alt="Camera settings"></button>
  </div>
</div>

<!-- Disconnect confirm -->
<div id="disconnect-overlay">
  <div id="disconnect-sheet">
    <h2>Disconnect?</h2>
    <p>This will end the live feed and return to the connect screen.</p>
    <div class="disconnect-btns">
      <button id="disconnect-cancel">Stay</button>
      <button id="disconnect-confirm">Disconnect</button>
    </div>
  </div>
</div>

<!-- Camera settings panel -->
<div id="cam-settings">
  <div id="cam-backdrop"></div>
  <div id="cam-sheet">
    <div class="sheet-header">
      <h2>Camera Settings</h2>
      <button class="close-btn" id="cam-close">✕</button>
    </div>
    <div id="cam-controls-body"><p style="color:var(--muted)">Loading…</p></div>
  </div>
<script>
const STORAGE_KEY = 'catcam_v1';

// ── Ripple effect ────────────────────────────────────────────────────────────
document.querySelectorAll('.btn-primary, .btn-text').forEach(btn => {
  btn.addEventListener('pointerdown', e => {
    const r = document.createElement('span');
    const rect = btn.getBoundingClientRect();
    const size = Math.max(rect.width, rect.height);
    r.className = 'ripple';
    r.style.cssText = `width:${size}px;height:${size}px;left:${e.clientX-rect.left-size/2}px;top:${e.clientY-rect.top-size/2}px`;
    btn.appendChild(r);
    r.addEventListener('animationend', () => r.remove());
  });
});

// Pop animation on icon buttons when released
document.querySelectorAll('.icon-btn, #ptt-btn').forEach(btn => {
  btn.addEventListener('pointerup', () => {
    btn.classList.remove('pop');
    void btn.offsetWidth;
    btn.classList.add('pop');
    btn.addEventListener('animationend', () => btn.classList.remove('pop'), { once: true });
  });
});

// ── Config ──────────────────────────────────────────────────────────────────

function loadCfg() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) ?? {}; }
  catch { return {}; }
}
function saveCfg(c) { localStorage.setItem(STORAGE_KEY, JSON.stringify(c)); }

const $ = id => document.getElementById(id);
const saved = loadCfg();

// ── State ───────────────────────────────────────────────────────────────────

let cfg = null;
let viewPc = null;
let pttPc = null;
let pttStream = null;
let zoom = 1;
let reconnectTimer = null;
let showCamTimer = null;
let isInCam = false;

// ── Screen transitions ───────────────────────────────────────────────────────

function showSetup(errorMsg = '') {
  isInCam = false;
  $('loading').style.display = 'none';
  $('cam').style.display = 'none';
  const s = $('setup');
  s.style.display = 'flex';
  s.classList.remove('screen-fade'); void s.offsetWidth; s.classList.add('screen-fade');
  const errEl = $('setup-error');
  if (errEl) { errEl.textContent = errorMsg; errEl.style.display = errorMsg ? 'block' : 'none'; }
  updateSetupView();
}

function showLoading() {
  const setup = $('setup');
  $('cam').style.display = 'none';
  $('loading-status').textContent = 'Connecting…';
  // slide setup out, then swap screens
  setup.classList.remove('slide-out'); void setup.offsetWidth; setup.classList.add('slide-out');
  setTimeout(() => {
    setup.style.display = 'none';
    setup.classList.remove('slide-out');
    const l = $('loading');
    l.style.display = 'flex';
    l.classList.remove('screen-fade'); void l.offsetWidth; l.classList.add('screen-fade');
  }, 300);
}

let wakeLock = null;
async function acquireWakeLock() {
  try { wakeLock = await navigator.wakeLock.request('screen'); } catch {}
}
function releaseWakeLock() {
  if (wakeLock) { wakeLock.release(); wakeLock = null; }
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && isInCam) acquireWakeLock();
});

function showCam() {
  if (isInCam) return;
  isInCam = true;
  $('loading-status').textContent = 'Loading feed…';
  showCamTimer = setTimeout(() => {
    $('loading').style.display = 'none';
    $('setup').style.display = 'none';
    const c = $('cam');
    c.style.display = 'flex';
    c.classList.remove('screen-fade'); void c.offsetWidth; c.classList.add('screen-fade');
    acquireWakeLock();
    pushCamHistory();
    // pre-acquire mic so first press doesn't disrupt the stream
    navigator.mediaDevices.getUserMedia({ audio: true, video: false })
      .then(s => { pttStream = s; })
      .catch(() => {});
  }, 4000);
}

function updateSetupView() {
  const hasCfg = !!(saved.host);
  $('quick-connect').style.display = hasCfg ? 'flex' : 'none';
  $('full-form').style.display     = hasCfg ? 'none' : 'flex';
  if (hasCfg) {
    const host = saved.host.replace(/^https?:\/\//, '').replace(/:\d+$/, '');
    $('quick-host').textContent = host;
  }
}

// ── Setup ───────────────────────────────────────────────────────────────────

// Populate full form from saved config
if (saved.user) $('cfg-user').value = saved.user;
if (saved.pass) $('cfg-pass').value = saved.pass;

updateSetupView();

$('quick-connect-btn').addEventListener('click', () => {
  cfg = { ...saved };
  showLoading();
  connect();
});

$('edit-creds-btn').addEventListener('click', () => {
  $('quick-connect').style.display = 'none';
  const ff = $('full-form');
  ff.style.display = 'flex';
  ff.classList.remove('slide-up'); void ff.offsetWidth; ff.classList.add('slide-up');
  $('cancel-edit-btn').style.display = 'block';
});

$('cancel-edit-btn').addEventListener('click', () => {
  $('full-form').style.display = 'none';
  const qc = $('quick-connect');
  qc.style.display = 'flex';
  qc.classList.remove('slide-up'); void qc.offsetWidth; qc.classList.add('slide-up');
});

$('connect-btn').addEventListener('click', () => {
  cfg = {
    host: 'https://rhyho-pi.tailcceb24.ts.net:8889',
    path: 'cam',
    user: $('cfg-user').value.trim(),
    pass: $('cfg-pass').value,
  };
  Object.assign(saved, cfg);
  saveCfg(cfg);
  showLoading();
  connect();
});

$('cancel-connect-btn').addEventListener('click', () => {
  clearTimeout(showCamTimer);
  showCamTimer = null;
  isInCam = false;
  cleanup();
  showSetup();
});

$('conn-btn').addEventListener('click', () => showDisconnectPrompt());

// ── Connection stats overlay ─────────────────────────────────────────────────
let statsInterval = null;

async function refreshStats() {
  if (!viewPc) return;
  const reports = await viewPc.getStats();
  let video = {}, audio = {}, rtt = null;
  reports.forEach(r => {
    if (r.type === 'inbound-rtp' && r.kind === 'video') video = r;
    if (r.type === 'inbound-rtp' && r.kind === 'audio') audio = r;
    if (r.type === 'candidate-pair' && r.state === 'succeeded') rtt = r.currentRoundTripTime;
  });
  const fmt = n => n == null ? '—' : n;
  $('stats-overlay').innerHTML = `
    <dt>Resolution</dt><dd>${video.frameWidth ? video.frameWidth + '×' + video.frameHeight : '—'}</dd>
    <dt>Framerate</dt><dd>${video.framesPerSecond ? Math.round(video.framesPerSecond) + ' fps' : '—'}</dd>
    <dt>Video loss</dt><dd>${fmt(video.packetsLost)} pkts</dd>
    <dt>Jitter</dt><dd>${audio.jitter != null ? (audio.jitter * 1000).toFixed(1) + ' ms' : '—'}</dd>
    <dt>Round-trip</dt><dd>${rtt != null ? (rtt * 1000).toFixed(0) + ' ms' : '—'}</dd>
  `;
}

$('status-badge').addEventListener('click', () => {
  const overlay = $('stats-overlay');
  const open = overlay.classList.toggle('open');
  if (open) { refreshStats(); statsInterval = setInterval(refreshStats, 1500); }
  else clearInterval(statsInterval);
});

$('video-wrap').addEventListener('click', e => {
  if (!$('status-badge').contains(e.target) && !$('stats-overlay').contains(e.target)) {
    $('stats-overlay').classList.remove('open');
    clearInterval(statsInterval);
  }
});

// ── WHEP viewer ─────────────────────────────────────────────────────────────

function setStatus(cls, text) {
  const el = $('status-badge');
  el.className = cls;
  el.textContent = text;
}

function buildHeaders() {
  const h = { 'Content-Type': 'application/sdp' };
  if (cfg.user && cfg.pass) h['Authorization'] = 'Basic ' + btoa(`${cfg.user}:${cfg.pass}`);
  return h;
}

function authUrl(base) { return base; }

async function connect() {
  clearTimeout(reconnectTimer);
  if (!isInCam) $('loading-status').textContent = 'Connecting…';
  else setStatus('s-connecting', 'Reconnecting…');

  if (viewPc) { viewPc.close(); viewPc = null; }

  const pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
  viewPc = pc;

  const stream = new MediaStream();
  $('video').srcObject = stream;
  pc.ontrack = e => stream.addTrack(e.track);

  pc.onconnectionstatechange = () => {
    if (pc !== viewPc) return;
    const s = pc.connectionState;
    if (s === 'connected')    { showCam(); setStatus('s-live', '● Live'); setTimeout(() => $('reconnect-overlay').classList.remove('visible'), 2000); }
    if (s === 'disconnected') { setStatus('s-connecting', 'Reconnecting…'); $('reconnect-overlay').classList.add('visible'); $('reconnect-status').textContent = 'Reconnecting…'; scheduleReconnect(); }
    if (s === 'failed')       { setStatus('s-error', 'Connection failed'); $('reconnect-overlay').classList.add('visible'); $('reconnect-status').textContent = 'Connection lost…'; scheduleReconnect(); }
  };

  pc.addTransceiver('video', { direction: 'recvonly' });
  pc.addTransceiver('audio', { direction: 'recvonly' });

  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);
  await waitForIce(pc);

  let res;
  try {
    res = await fetch(authUrl(`${cfg.host}/${cfg.path}/whep`), {
      method: 'POST',
      headers: buildHeaders(),
      body: pc.localDescription.sdp,
    });
  } catch {
    if (!isInCam) $('loading-status').textContent = 'Cannot reach server — retrying…';
    else setStatus('s-error', 'Cannot reach server');
    scheduleReconnect(8000);
    return;
  }

  if (res.status === 401) {
    cleanup();
    showSetup('Invalid credentials — check your username and password.');
    return;
  }
  if (!res.ok) {
    if (!isInCam) $('loading-status').textContent = `Error ${res.status} — retrying…`;
    else setStatus('s-error', `Error ${res.status}`);
    scheduleReconnect();
    return;
  }

  await pc.setRemoteDescription({ type: 'answer', sdp: await res.text() });
}

function scheduleReconnect(ms = 5000) {
  clearTimeout(reconnectTimer);
  reconnectTimer = setTimeout(connect, ms);
}

function waitForIce(pc) {
  return new Promise(resolve => {
    if (pc.iceGatheringState === 'complete') { resolve(); return; }
    const cb = () => {
      if (pc.iceGatheringState === 'complete') {
        pc.removeEventListener('icegatheringstatechange', cb);
        resolve();
      }
    };
    pc.addEventListener('icegatheringstatechange', cb);
    setTimeout(resolve, 5000); // fallback
  });
}

function cleanup() {
  clearTimeout(reconnectTimer);
  releaseWakeLock();
  if (viewPc) { viewPc.close(); viewPc = null; }
  stopPtt();
  teardownPttStream();
}

// ── Mute toggle ─────────────────────────────────────────────────────────────

$('mute-btn').addEventListener('click', () => {
  const v = $('video');
  v.muted = !v.muted;
  const img = $('mute-btn').querySelector('img');
  if (img) img.src = v.muted ? 'icons/no-sound.png' : 'icons/sound-active.png';
  $('mute-btn').classList.toggle('sound-active', !v.muted);
  $('mute-btn').classList.toggle('muted', v.muted);
  if (!v.muted) {
    v.play().catch(() => {});
    $('ptt-btn').disabled = false;
  }
});

// ── Push-to-talk (WHIP) ─────────────────────────────────────────────────────

async function startPtt() {
  if (!pttStream) {
    try {
      pttStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
    } catch {
      alert('Microphone access denied');
      return;
    }
  }

  if (pttPc) { pttPc.close(); }
  const pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
  pttPc = pc;

  pttStream.getAudioTracks().forEach(t => pc.addTrack(t, pttStream));

  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);
  await waitForIce(pc);

  try {
    const res = await fetch(authUrl(`${cfg.host}/${cfg.path}/whip`), {
      method: 'POST',
      headers: buildHeaders(),
      body: pc.localDescription.sdp,
    });
    if (res.ok) {
      await pc.setRemoteDescription({ type: 'answer', sdp: await res.text() });
    } else {
      stopPtt(); // revert if server rejected
    }
  } catch { stopPtt(); }
}

function stopPtt() {
  if (pttPc) { pttPc.close(); pttPc = null; }
  // keep pttStream alive to avoid audio routing disruption on retoggle
  pttActive = false;
  $('ptt-btn').classList.remove('talking');
  const img = $('ptt-btn').querySelector('img');
  if (img) img.src = 'icons/mic-inactive.png';
}

function teardownPttStream() {
  if (pttStream) { pttStream.getTracks().forEach(t => t.stop()); pttStream = null; }
}

let pttActive = false;
const pttBtn = $('ptt-btn');
pttBtn.addEventListener('click', () => {
  pttActive = !pttActive;
  if (pttActive) {
    pttBtn.classList.add('talking');
    const img = pttBtn.querySelector('img');
    if (img) img.src = 'icons/mic-active.png';
    startPtt();
  } else {
    stopPtt();
  }
});

// ── Zoom ────────────────────────────────────────────────────────────────────

const videoEl = $('video');

function setZoom(z) {
  zoom = Math.min(4, Math.max(1, z));
  if (zoom === 1) { panX = 0; panY = 0; }
  clampPan();
  videoEl.style.transform = zoom === 1 ? '' : `translate(${panX}px, ${panY}px) scale(${zoom})`;
}

let panX = 0, panY = 0;

function clampPan() {
  const wrap = $('video-wrap');
  const maxX = wrap.clientWidth  * (zoom - 1) / 2;
  const maxY = wrap.clientHeight * (zoom - 1) / 2;
  panX = Math.min(maxX, Math.max(-maxX, panX));
  panY = Math.min(maxY, Math.max(-maxY, panY));
}

// Unified touch handler: 1 finger = pan, 2 fingers = pinch zoom
let pinchStartDist = 0;
let pinchStartZoom = 1;
let dragStartX = 0, dragStartY = 0;
let dragStartPanX = 0, dragStartPanY = 0;

const wrap = $('video-wrap');

wrap.addEventListener('touchstart', e => {
  if (e.touches.length === 2) {
    pinchStartDist = getTouchDist(e);
    pinchStartZoom = zoom;
  } else if (e.touches.length === 1 && zoom > 1) {
    dragStartX = e.touches[0].clientX;
    dragStartY = e.touches[0].clientY;
    dragStartPanX = panX;
    dragStartPanY = panY;
  }
}, { passive: true });

wrap.addEventListener('touchmove', e => {
  if (e.touches.length === 2 && pinchStartDist) {
    const newZoom = pinchStartZoom * (getTouchDist(e) / pinchStartDist);
    zoom = Math.min(4, Math.max(1, newZoom));
    clampPan();
    videoEl.style.transform = zoom === 1 ? '' : `translate(${panX}px, ${panY}px) scale(${zoom})`;
  } else if (e.touches.length === 1 && zoom > 1) {
    panX = dragStartPanX + (e.touches[0].clientX - dragStartX);
    panY = dragStartPanY + (e.touches[0].clientY - dragStartY);
    clampPan();
    videoEl.style.transform = `translate(${panX}px, ${panY}px) scale(${zoom})`;
  }
}, { passive: true });

wrap.addEventListener('touchend', e => {
  if (e.touches.length < 2) pinchStartDist = 0;
});

function getTouchDist(e) {
  return Math.hypot(
    e.touches[0].clientX - e.touches[1].clientX,
    e.touches[0].clientY - e.touches[1].clientY
  );
}

// ── Camera settings panel ───────────────────────────────────────────────────

const camPanel = $('cam-settings');
let camDebounce = null;

function camApiBase() {
  return cfg ? cfg.host.replace(/:(\d+)$/, ':8081') : '';
}

$('cam-settings-btn').addEventListener('click', () => {
  camPanel.classList.add('open');
  loadCamControls();
});
$('cam-close').addEventListener('click',    () => camPanel.classList.remove('open'));
$('cam-backdrop').addEventListener('click', () => camPanel.classList.remove('open'));

async function loadCamControls() {
  const body = $('cam-controls-body');
  try {
    const res = await fetch(`${camApiBase()}/camera`);
    if (!res.ok) throw new Error(res.status);
    const { controls, values } = await res.json();
    renderCamControls(controls, values, body);
  } catch {
    body.innerHTML = '<p style="color:var(--danger);font-size:0.9rem">Could not reach camera API.<br>Check the API service is running on port 8081.</p>';
  }
}

function renderCamControls(controls, values, container) {
  const groups = [
    { label: 'Image',         keys: ['brightness', 'contrast', 'saturation', 'sharpness'] },
    { label: 'Exposure',      keys: ['auto_exposure', 'gain', 'exposure_time_absolute'] },
    { label: 'White Balance', keys: ['white_balance_automatic', 'white_balance_temperature'] },
    { label: 'Optics',        keys: ['backlight_compensation'] },
  ];

  container.innerHTML = '';

  groups.forEach(group => {
    const grp = document.createElement('div');
    grp.className = 'ctrl-group';
    grp.innerHTML = `<div class="ctrl-group-label">${group.label}</div>`;

    group.keys.forEach(key => {
      const c = controls[key];
      if (!c) return;
      const val = values[key] ?? c.default;
      const row = document.createElement('div');
      row.className = 'ctrl-row';
      row.dataset.key = key;

      // Disable dependent controls based on current auto state
      if (key === 'exposure_time_absolute' && (values['auto_exposure'] ?? 3) === 3) row.classList.add('disabled');
      if (key === 'gain'                   && (values['auto_exposure'] ?? 3) === 3) row.classList.add('disabled');
      if (key === 'white_balance_temperature' && (values['white_balance_automatic'] ?? 1) === 1) row.classList.add('disabled');

      if (key === 'auto_exposure') {
        row.innerHTML = `<span class="ctrl-label">${c.label}</span>
          <label class="ctrl-toggle"><input type="checkbox" ${val === 3 ? 'checked' : ''}><span class="toggle-track"></span></label>`;
        row.querySelector('input').addEventListener('change', e => {
          const v = e.target.checked ? 3 : 1;
          setCamControl('auto_exposure', v);
          const expRow  = container.querySelector('[data-key="exposure_time_absolute"]');
          const gainRow = container.querySelector('[data-key="gain"]');
          if (expRow)  expRow.classList.toggle('disabled', e.target.checked);
          if (gainRow) gainRow.classList.toggle('disabled', e.target.checked);
        });
      } else if (c.min === 0 && c.max === 1) {
        row.innerHTML = `<span class="ctrl-label">${c.label}</span>
          <label class="ctrl-toggle"><input type="checkbox" ${val ? 'checked' : ''}><span class="toggle-track"></span></label>`;
        row.querySelector('input').addEventListener('change', e => {
          setCamControl(key, e.target.checked ? 1 : 0);
          if (key === 'white_balance_automatic') {
            const wbRow = container.querySelector('[data-key="white_balance_temperature"]');
            if (wbRow) wbRow.classList.toggle('disabled', e.target.checked);
          }
        });
      } else {
        row.innerHTML = `<span class="ctrl-label">${c.label}</span>
          <input type="range" class="ctrl-slider" min="0" max="100" step="5" value="${toPercent(val, c.min, c.max)}">
          <span class="ctrl-value">${toPercent(val, c.min, c.max)}%</span>
          <button class="reset-btn" title="Reset to default">↺</button>`;
        const slider  = row.querySelector('input[type=range]');
        const valEl   = row.querySelector('.ctrl-value');
        const resetEl = row.querySelector('.reset-btn');
        slider.addEventListener('input', () => {
          valEl.textContent = slider.value + '%';
          navigator.vibrate && navigator.vibrate(8);
          clearTimeout(camDebounce);
          camDebounce = setTimeout(() => setCamControl(key, fromPercent(+slider.value, c.min, c.max)), 300);
        });
        resetEl.addEventListener('click', () => {
          const pct = toPercent(c.default, c.min, c.max);
          slider.value = pct;
          valEl.textContent = pct + '%';
          setCamControl(key, c.default);
        });
      }

      grp.appendChild(row);
    });

    container.appendChild(grp);
  });
}

async function setCamControl(key, value) {
  try {
    await fetch(`${camApiBase()}/camera`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ [key]: value }),
    });
  } catch { /* ignore */ }
}

// ── Slider percent helpers ───────────────────────────────────────────────────
function toPercent(val, min, max) { return Math.round((val - min) / (max - min) * 100); }
function fromPercent(pct, min, max) { return Math.round(min + (pct / 100) * (max - min)); }

// ── Haptic feedback ──────────────────────────────────────────────────────────
function haptic(ms = 10) { navigator.vibrate && navigator.vibrate(ms); }
$('mute-btn').addEventListener('pointerdown', () => haptic());
$('ptt-btn').addEventListener('pointerdown', () => haptic());

// ── Disconnect confirm popup ─────────────────────────────────────────────────
const discOverlay = $('disconnect-overlay');
function showDisconnectPrompt() {
  discOverlay.classList.add('open');
}
$('disconnect-cancel').addEventListener('click', () => {
  discOverlay.classList.remove('open');
  history.pushState({ cam: true }, ''); // re-arm back button
});
$('disconnect-confirm').addEventListener('click', () => {
  discOverlay.classList.remove('open');
  cleanup();
  $('video').muted = true;
  const muteImg = $('mute-btn').querySelector('img');
  if (muteImg) muteImg.src = 'icons/no-sound.png';
  $('mute-btn').classList.add('muted');
  showSetup();
});

// ── Back button (Android) ────────────────────────────────────────────────────
function pushCamHistory() { history.pushState({ cam: true }, ''); }
window.addEventListener('popstate', () => {
  if (discOverlay.classList.contains('open')) {
    discOverlay.classList.remove('open');
    pushCamHistory();
    return;
  }
  const camPanel = $('cam-settings');
  if (camPanel.classList.contains('open')) {
    camPanel.classList.remove('open');
    pushCamHistory();
    return;
  }
  if (isInCam) {
    showDisconnectPrompt();
    pushCamHistory();
  }
});

// Push history state when entering cam so first back press is caught
const _origShowCam = showCam;

// ── Service Worker ──────────────────────────────────────────────────────────

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(() => {});
}
</script>
